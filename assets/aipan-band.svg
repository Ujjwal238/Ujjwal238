<svg xmlns="http://www.w3.org/2000/svg" width="832" height="32" viewBox="0 0 3120 120" role="img" aria-label="Aipan border">
  <!-- One strip of the portfolio's diamond-and-flower border, for use above and below the text in the GitHub README.
       Same colours as the site: red #772018, linework #fdfbf7. #t is one 120-unit tile, repeated 26 times. -->
  <defs>
    <g id="t">
      <path d="M0 60 60 8 120 60 60 112Z" stroke-width="5"/>
      <path d="M43.8 7 0 45M26.5 7 0 30M76.2 7 120 45M93.5 7 120 30"/>
      <path d="M43.8 113 0 75M26.5 113 0 90M76.2 113 120 75M93.5 113 120 90"/>
      <path d="M0 7H10L0 16ZM120 7H110L120 16ZM0 113H10L0 104ZM120 113H110L120 104Z" fill="#fdfbf7" stroke-width="2"/>
      <g fill="#fdfbf7" stroke="none" transform="translate(60 60)">
        <circle r="5"/>
        <ellipse cy="-18.5" rx="5.6" ry="10.5"/>
        <ellipse cy="-18.5" rx="5.6" ry="10.5" transform="rotate(45)"/>
        <ellipse cy="-18.5" rx="5.6" ry="10.5" transform="rotate(90)"/>
        <ellipse cy="-18.5" rx="5.6" ry="10.5" transform="rotate(135)"/>
        <ellipse cy="-18.5" rx="5.6" ry="10.5" transform="rotate(180)"/>
        <ellipse cy="-18.5" rx="5.6" ry="10.5" transform="rotate(225)"/>
        <ellipse cy="-18.5" rx="5.6" ry="10.5" transform="rotate(270)"/>
        <ellipse cy="-18.5" rx="5.6" ry="10.5" transform="rotate(315)"/>
      </g>
    </g>
    <clipPath id="round"><rect width="3120" height="120" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="3120" height="120" fill="#772018"/>
    <g fill="none" stroke="#fdfbf7" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 5H3120M0 115H3120" stroke-width="5.5"/>
    <use href="#t" x="0"/>
    <use href="#t" x="120"/>
    <use href="#t" x="240"/>
    <use href="#t" x="360"/>
    <use href="#t" x="480"/>
    <use href="#t" x="600"/>
    <use href="#t" x="720"/>
    <use href="#t" x="840"/>
    <use href="#t" x="960"/>
    <use href="#t" x="1080"/>
    <use href="#t" x="1200"/>
    <use href="#t" x="1320"/>
    <use href="#t" x="1440"/>
    <use href="#t" x="1560"/>
    <use href="#t" x="1680"/>
    <use href="#t" x="1800"/>
    <use href="#t" x="1920"/>
    <use href="#t" x="2040"/>
    <use href="#t" x="2160"/>
    <use href="#t" x="2280"/>
    <use href="#t" x="2400"/>
    <use href="#t" x="2520"/>
    <use href="#t" x="2640"/>
    <use href="#t" x="2760"/>
    <use href="#t" x="2880"/>
    <use href="#t" x="3000"/>
    </g>
  </g>
</svg>
