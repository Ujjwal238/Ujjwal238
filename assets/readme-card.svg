<svg xmlns="http://www.w3.org/2000/svg" width="832" height="236" viewBox="0 0 832 236" role="img" aria-label="Ujjwal Mishra - I love making machines talk human. Portfolio: ujjwal238.github.io/Ujjwal238">
  <!-- GitHub profile card: the portfolio's header as one image, because a README cannot carry its own background or colours.
       Same values as style.css: paper #fdfbf7 with the brown grain, red #772018, text #421510, diamond border top and bottom.
       #t is one 120-unit border tile. -->
  <defs>
    <g id="t">
      <path d="M0 60 60 8 120 60 60 112Z" stroke-width="5"/>
      <path d="M43.8 7 0 45M26.5 7 0 30M76.2 7 120 45M93.5 7 120 30"/>
      <path d="M43.8 113 0 75M26.5 113 0 90M76.2 113 120 75M93.5 113 120 90"/>
      <path d="M0 7H10L0 16ZM120 7H110L120 16ZM0 113H10L0 104ZM120 113H110L120 104Z" fill="#fdfbf7" stroke-width="2"/>
      <g fill="#fdfbf7" stroke="none" transform="translate(60 60)">
        <circle r="5"/>
        <ellipse cy="-18.5" rx="5.6" ry="10.5"/>
        <ellipse cy="-18.5" rx="5.6" ry="10.5" transform="rotate(45)"/>
        <ellipse cy="-18.5" rx="5.6" ry="10.5" transform="rotate(90)"/>
        <ellipse cy="-18.5" rx="5.6" ry="10.5" transform="rotate(135)"/>
        <ellipse cy="-18.5" rx="5.6" ry="10.5" transform="rotate(180)"/>
        <ellipse cy="-18.5" rx="5.6" ry="10.5" transform="rotate(225)"/>
        <ellipse cy="-18.5" rx="5.6" ry="10.5" transform="rotate(270)"/>
        <ellipse cy="-18.5" rx="5.6" ry="10.5" transform="rotate(315)"/>
      </g>
    </g>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="3"/>
      <feColorMatrix values="0 0 0 0 .35 0 0 0 0 .15 0 0 0 0 .08 0 0 0 .34 -.11"/>
    </filter>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#772018" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#772018"/>
      <stop offset="0.7" stop-color="#772018"/>
      <stop offset="1" stop-color="#772018" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="round"><rect width="832" height="236" rx="8"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
